name: stellar-horizon-utils package

# Builds stellar-horizon-utils from stellar-horizon-utils/, replacing the
# stellar-horizon-utils-package-builder Jenkins job (stellar/ops#5060). Publishing it to
# apt.stellar.org comes next, once the publish path can upload to several distros.
#
# REVISION_OFFSET starts the Debian revision above the Jenkins job's last build (#6), so apt
# treats these as newer.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Upstream version; the package is stellar-horizon-utils_<version>-<revision>
        type: string
        default: "0.3"

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    # The distro the Jenkins job's pbuilder chroot used. The same .deb goes to every distro.
    container: ubuntu:20.04
    permissions:
      contents: read
    defaults:
      run:
        shell: bash # the container's default is sh
    env:
      DEBFULLNAME: Package Maintainer
      DEBEMAIL: packages@stellar.org
      DEBIAN_FRONTEND: noninteractive
      VERSION: ${{ inputs.version }}
      REVISION_OFFSET: 6
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install the build dependencies
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends devscripts
          # The package's Build-Depends from debian/control, as pbuilder installed them
          apt-get build-dep -y -qq ./stellar-horizon-utils

      - name: Set the version
        run: |
          set -euo pipefail
          REVISION=$(( REVISION_OFFSET + GITHUB_RUN_NUMBER ))
          dch --changelog stellar-horizon-utils/debian/changelog --distribution focal \
            --newversion "${VERSION}-${REVISION}" "New version"

      - name: Build the package
        run: |
          set -euo pipefail
          (cd stellar-horizon-utils && dpkg-buildpackage -b -us -uc)
          mkdir debs
          mv stellar-horizon-utils_*.deb debs/
          dpkg-deb --info debs/*.deb
          dpkg-deb --contents debs/*.deb

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debs
          path: debs/*.deb
          if-no-files-found: error
